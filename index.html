<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Council Orchestrator</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@keyframes pulse-fast {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.3; }
		}
		.animate-pulse-fast {
			animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		.markdown-content p { margin-bottom: 0.75em; }
		.markdown-content ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
		.markdown-content h3 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e2e8f0; }
		.markdown-content h2 { font-weight: bold; margin-top: 1.2em; margin-bottom: 0.5em; color: #f8fafc; }
		.markdown-content strong { color: #f8fafc; }
		
		/* Custom Scrollbar */
		::-webkit-scrollbar { width: 8px; }
		::-webkit-scrollbar-track { background: #0f172a; }
		::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
		::-webkit-scrollbar-thumb:hover { background: #475569; }

		/* Details Tag Reset */
		details > summary { list-style: none; }
		details > summary::-webkit-details-marker { display: none; }
	</style>
</head>
<body class="bg-slate-900 text-slate-300 font-sans min-h-screen pb-12 transition-colors duration-200">
	
	<!-- App Wrapper -->
	<div class="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 space-y-6">
		
		<!-- Header & Controls -->
		<header class="flex justify-between items-center bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700">
			<div>
				<h1 class="text-2xl font-bold text-slate-100 tracking-tight">AI Council Orchestrator</h1>
				<p class="text-sm text-slate-400">Multi-Agent Debate Framework</p>
			</div>
			<div class="flex gap-2">
				<button id="toggleHistoryBtn" class="px-4 py-2 bg-slate-700 text-slate-200 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shadow-sm">
					📚 History
				</button>
				<button id="toggleSettingsBtn" class="px-4 py-2 bg-slate-700 text-slate-200 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shadow-sm">
					⚙️ Settings
				</button>
			</div>
		</header>

		<!-- History Panel -->
		<div id="historyPanel" class="hidden bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-4">
			<div class="flex justify-between items-center border-b border-slate-700 pb-2">
				<h2 class="text-xl font-bold text-slate-100">Debate History</h2>
				<button id="clearHistoryBtn" class="text-red-400 hover:text-red-300 text-sm font-semibold">Clear All</button>
			</div>
			<div id="historyList" class="space-y-3 max-h-96 overflow-y-auto pr-2">
				<!-- Populated via JS -->
			</div>
		</div>

		<!-- Settings Panel -->
		<div id="settingsPanel" class="hidden bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-6">
			<h2 class="text-xl font-bold text-slate-100 border-b border-slate-700 pb-2">Configuration & API Keys</h2>
			
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">OpenAI API Key</label>
					<input type="password" id="keyOpenai" placeholder="sk-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">Anthropic API Key</label>
					<input type="password" id="keyAnthropic" placeholder="sk-ant-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">Google Gemini API Key</label>
					<input type="password" id="keyGemini" placeholder="AIza..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">DeepSeek API Key</label>
					<input type="password" id="keyDeepseek" placeholder="sk-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
			</div>

			<div class="border-t border-slate-700 pt-5">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-lg font-bold text-slate-100">Council Members (Phase 1)</h3>
					<button id="addMemberBtn" class="px-3 py-1.5 bg-blue-900/50 text-blue-300 border border-blue-800 rounded-md hover:bg-blue-800 transition-colors text-sm font-semibold">
						+ Add Member
					</button>
				</div>
				<div id="councilList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<!-- Populated via JS -->
				</div>
			</div>

			<div class="border-t border-slate-700 pt-5 space-y-4">
				<div>
					<label class="block text-lg font-bold mb-2 text-slate-100">Moderator/Auditor (Phase 2)</label>
					<textarea id="overseerPrompt" rows="3" class="w-full p-3 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
				</div>
				<div>
					<label class="block text-lg font-bold mb-2 text-slate-100">Executive Communicator (Phase 3)</label>
					<textarea id="communicatorPrompt" rows="3" class="w-full p-3 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
				</div>
			</div>
		</div>

		<!-- Main Input Area -->
		<div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
			
			<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
				<label class="text-lg font-bold text-slate-100">Issue to the Council</label>
				
				<!-- Engine Selector -->
				<div class="flex gap-2 w-full md:w-auto">
					<select id="activeProvider" class="p-2 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:flex-none">
						<option value="openai">OpenAI</option>
						<option value="anthropic">Anthropic</option>
						<option value="gemini">Google Gemini</option>
						<option value="deepseek">DeepSeek</option>
					</select>
					<input type="text" id="activeModel" class="p-2 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:w-48" placeholder="Model Name">
				</div>
			</div>

			<div class="flex flex-col gap-4">
				<textarea id="userPrompt" rows="3" placeholder="State your premise, dilemma, or question..." class="w-full p-4 border border-slate-600 rounded-lg bg-slate-900 text-slate-100 resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 text-base placeholder-slate-500"></textarea>
				<button id="submitBtn" class="w-full py-4 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-500 transition-colors disabled:opacity-50 shadow-lg text-lg">
					Convene Council
				</button>
			</div>
		</div>

		<!-- Final Executive Output (Visible by Default) -->
		<div id="executiveContainer" class="hidden bg-slate-800 p-6 md:p-8 rounded-xl shadow-lg border border-emerald-900/50 mt-8 relative">
			<div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-3">
				<div class="flex items-center gap-3">
					<h2 class="text-2xl font-bold text-emerald-400 tracking-tight">Executive Summary</h2>
					<span id="executiveIndicator" class="w-3 h-3 rounded-full bg-emerald-500 hidden"></span>
				</div>
				<div class="flex gap-2">
					<button onclick="copyRawText('executiveRaw')" class="text-slate-400 hover:text-white transition-colors p-2" title="Copy Summary">📋</button>
					<button onclick="exportCurrentDebate()" class="text-slate-400 hover:text-emerald-400 transition-colors p-2" title="Export Full Debate (.md)">💾</button>
				</div>
			</div>
			<div id="executiveOutput" class="markdown-content text-slate-200 text-lg leading-relaxed"></div>
		</div>

		<!-- Detailed Audit Log (Collapsible) -->
		<details id="auditLogContainer" class="hidden bg-slate-800 rounded-xl shadow-lg border border-slate-700 mt-6 group">
			<summary class="p-5 font-bold text-slate-300 cursor-pointer flex justify-between items-center hover:bg-slate-700/50 transition-colors rounded-xl">
				<span class="flex items-center gap-2">
					<span class="text-slate-500 group-open:rotate-90 transition-transform">▶</span>
					View Detailed Council Audit & Synthesis
				</span>
			</summary>
			
			<div class="p-6 border-t border-slate-700 space-y-8">
				<!-- Phase 2: Synthesis Container -->
				<div class="bg-slate-900 p-6 rounded-xl border border-blue-900/30 relative">
					<div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
						<h3 class="font-bold text-blue-400 flex items-center gap-3 cursor-pointer select-none" onclick="toggleCollapse('synthesis')">
							<span class="text-xs text-slate-500 w-3 text-center" id="icon-synthesis">▼</span>
							Moderator Synthesis
						</h3>
						<button onclick="copyRawText('synthesisRaw')" class="text-slate-400 hover:text-white transition-colors" title="Copy Synthesis">📋</button>
					</div>
					<div id="content-synthesis" class="markdown-content text-slate-400 text-sm leading-relaxed overflow-hidden transition-all"></div>
				</div>

				<!-- Phase 1: Active Debate Grid -->
				<div>
					<h3 class="text-lg font-bold text-slate-300 mb-4 px-1">Raw Council Outputs</h3>
					<div id="debateGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
						<!-- Populated by JS during runtime -->
					</div>
				</div>
			</div>
		</details>

	</div>

	<script>
		// --- State & Defaults ---
		const defaultModels = {
			'openai': 'gpt-4o',
			'anthropic': 'claude-3-5-sonnet-20240620',
			'gemini': 'gemini-1.5-pro',
			'deepseek': 'deepseek-chat'
		};

		const defaultMembers = [
			{ id: 1, name: 'Empiricist', prompt: 'You are the Empiricist. Provide only verified data, physics, and raw computational facts. Do not give opinions. Do not hallucinate premises.' },
			{ id: 2, name: 'Forecaster', prompt: 'You are the Forecaster. Project the 10-, 50-, and 100-year second- and third-order consequences based strictly on the user premise.' },
			{ id: 3, name: 'Humanist', prompt: 'You are the Humanist. Evaluate the sociological and psychological impact on human populations. Focus on incentives and behavior.' },
			{ id: 4, name: 'Red Teamer', prompt: 'You are the Red Teamer. Sabotage and find the fatal flaws in the premise. Attack the core assumptions. Point out worst-case scenarios.' }
		];

		const state = {
			provider: 'openai',
			model: 'gpt-4o',
			apiKeys: { openai: '', anthropic: '', gemini: '', deepseek: '' },
			overseerPrompt: "You are the Moderator. Read the council debate. Map where they agree, highlight unresolvable disagreements, and provide a final executive summary. You must audit the provided logic. Do not generate original ideas, but explicitly point out if critical information or counter-factual analysis is missing from the council's assessment.",
			communicatorPrompt: "You are the Executive Communicator. Your job is to read the Moderator's technical Synthesis and translate it into a clear, conversational, and highly succinct summary (like a standard helpful chatbot). Strip out the meta-commentary about the council's process. Just give the user the bottom-line answer, the core risks, and the final verdict in plain, easy-to-digest language. Use bullet points for readability if needed.",
			members: JSON.parse(JSON.stringify(defaultMembers)),
			history: [],
			isRunning: false
		};

		window.rawOutputs = { executiveRaw: "", synthesisRaw: "" };
		window.currentDebateData = null; // Used for export

		// --- DOM Elements ---
		const els = {
			toggleSettingsBtn: document.getElementById('toggleSettingsBtn'),
			settingsPanel: document.getElementById('settingsPanel'),
			toggleHistoryBtn: document.getElementById('toggleHistoryBtn'),
			historyPanel: document.getElementById('historyPanel'),
			historyList: document.getElementById('historyList'),
			clearHistoryBtn: document.getElementById('clearHistoryBtn'),
			
			// Keys
			keyOpenai: document.getElementById('keyOpenai'),
			keyAnthropic: document.getElementById('keyAnthropic'),
			keyGemini: document.getElementById('keyGemini'),
			keyDeepseek: document.getElementById('keyDeepseek'),
			
			// Main Inputs
			activeProvider: document.getElementById('activeProvider'),
			activeModel: document.getElementById('activeModel'),
			userPrompt: document.getElementById('userPrompt'),
			submitBtn: document.getElementById('submitBtn'),
			
			// Configuration
			councilList: document.getElementById('councilList'),
			addMemberBtn: document.getElementById('addMemberBtn'),
			overseerPrompt: document.getElementById('overseerPrompt'),
			communicatorPrompt: document.getElementById('communicatorPrompt'),
			
			// Output Areas
			executiveContainer: document.getElementById('executiveContainer'),
			executiveOutput: document.getElementById('executiveOutput'),
			executiveIndicator: document.getElementById('executiveIndicator'),
			auditLogContainer: document.getElementById('auditLogContainer'),
			contentSynthesis: document.getElementById('content-synthesis'),
			debateGrid: document.getElementById('debateGrid')
		};

		// --- LocalStorage Management ---
		function saveState() {
			const toSave = {
				provider: state.provider,
				model: state.model,
				apiKeys: state.apiKeys,
				overseerPrompt: state.overseerPrompt,
				communicatorPrompt: state.communicatorPrompt,
				members: state.members,
				history: state.history
			};
			localStorage.setItem('ai_council_data_v3', JSON.stringify(toSave));
		}

		function loadState() {
			const saved = localStorage.getItem('ai_council_data_v3');
			if (saved) {
				const parsed = JSON.parse(saved);
				state.provider = parsed.provider || state.provider;
				state.model = parsed.model || state.model;
				state.apiKeys = parsed.apiKeys || state.apiKeys;
				state.overseerPrompt = parsed.overseerPrompt || state.overseerPrompt;
				state.communicatorPrompt = parsed.communicatorPrompt || state.communicatorPrompt;
				state.members = parsed.members && parsed.members.length > 0 ? parsed.members : state.members;
				state.history = parsed.history || [];
			}
			
			// Hydrate UI
			els.keyOpenai.value = state.apiKeys.openai;
			els.keyAnthropic.value = state.apiKeys.anthropic;
			els.keyGemini.value = state.apiKeys.gemini;
			els.keyDeepseek.value = state.apiKeys.deepseek;
			
			els.activeProvider.value = state.provider;
			els.activeModel.value = state.model;
			
			els.overseerPrompt.value = state.overseerPrompt;
			els.communicatorPrompt.value = state.communicatorPrompt;
			
			renderCouncilSettings();
			renderHistory();
		}

		// --- Initialization ---
		function init() {
			loadState();

			// Panel Toggles
			els.toggleSettingsBtn.addEventListener('click', () => {
				els.settingsPanel.classList.toggle('hidden');
				els.historyPanel.classList.add('hidden');
			});

			els.toggleHistoryBtn.addEventListener('click', () => {
				els.historyPanel.classList.toggle('hidden');
				els.settingsPanel.classList.add('hidden');
			});

			els.clearHistoryBtn.addEventListener('click', () => {
				if(confirm("Clear all debate history?")) {
					state.history = [];
					saveState();
					renderHistory();
				}
			});

			// API Key Event Listeners
			els.keyOpenai.addEventListener('input', (e) => { state.apiKeys.openai = e.target.value; saveState(); });
			els.keyAnthropic.addEventListener('input', (e) => { state.apiKeys.anthropic = e.target.value; saveState(); });
			els.keyGemini.addEventListener('input', (e) => { state.apiKeys.gemini = e.target.value; saveState(); });
			els.keyDeepseek.addEventListener('input', (e) => { state.apiKeys.deepseek = e.target.value; saveState(); });

			// Provider & Model Selection
			els.activeProvider.addEventListener('change', (e) => {
				state.provider = e.target.value;
				els.activeModel.value = defaultModels[state.provider];
				state.model = els.activeModel.value;
				saveState();
			});
			els.activeModel.addEventListener('input', (e) => { state.model = e.target.value; saveState(); });

			// System Prompts
			els.overseerPrompt.addEventListener('input', (e) => { state.overseerPrompt = e.target.value; saveState(); });
			els.communicatorPrompt.addEventListener('input', (e) => { state.communicatorPrompt = e.target.value; saveState(); });

			// Members
			els.addMemberBtn.addEventListener('click', () => {
				state.members.push({ id: Date.now(), name: 'New Persona', prompt: 'Enter conditioning rules here...' });
				renderCouncilSettings();
				saveState();
			});

			// Submission
			els.submitBtn.addEventListener('click', runCouncil);
			els.userPrompt.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runCouncil();
			});
		}

		function renderCouncilSettings() {
			els.councilList.innerHTML = '';
			state.members.forEach((member, index) => {
				const card = document.createElement('div');
				card.className = 'p-4 bg-slate-900 border border-slate-700 rounded-lg flex flex-col gap-3 group focus-within:border-blue-500';
				card.innerHTML = `
					<div class="flex justify-between items-center">
						<input type="text" class="font-bold text-slate-100 bg-transparent outline-none w-2/3 border-b border-transparent focus:border-blue-400" value="${member.name}" onchange="updateMemberName(${index}, this.value)">
						<button class="text-red-400 text-xs font-semibold px-2 py-1 rounded hover:bg-red-900/50 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity" onclick="removeMember(${index})">Remove</button>
					</div>
					<textarea rows="3" class="w-full text-sm p-2 bg-slate-800 text-slate-300 border border-slate-600 rounded outline-none focus:ring-2 focus:ring-blue-500 resize-y" onchange="updateMemberPrompt(${index}, this.value)">${member.prompt}</textarea>
				`;
				els.councilList.appendChild(card);
			});
		}

		function renderHistory() {
			els.historyList.innerHTML = '';
			if(state.history.length === 0) {
				els.historyList.innerHTML = '<p class="text-slate-500 italic text-sm">No past debates found.</p>';
				return;
			}
			
			[...state.history].reverse().forEach((item, index) => {
				const date = new Date(item.timestamp).toLocaleString();
				const row = document.createElement('div');
				row.className = 'p-3 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors';
				row.innerHTML = `
					<div class="text-xs text-slate-500 mb-1">${date}</div>
					<div class="text-sm text-slate-200 font-semibold truncate">${item.prompt}</div>
				`;
				row.addEventListener('click', () => loadHistoryItem(item));
				els.historyList.appendChild(row);
			});
		}

		window.updateMemberName = (index, val) => { state.members[index].name = val; saveState(); };
		window.updateMemberPrompt = (index, val) => { state.members[index].prompt = val; saveState(); };
		window.removeMember = (index) => { state.members.splice(index, 1); renderCouncilSettings(); saveState(); };

		window.toggleCollapse = (id) => {
			const contentDiv = document.getElementById(`content-${id}`);
			const icon = document.getElementById(`icon-${id}`);
			if (contentDiv.classList.contains('hidden')) {
				contentDiv.classList.remove('hidden');
				icon.innerText = '▼';
			} else {
				contentDiv.classList.add('hidden');
				icon.innerText = '▶';
			}
		};

		window.copyRawText = (mapKey) => {
			const text = window.rawOutputs[mapKey];
			if(!text) return;
			navigator.clipboard.writeText(text);
		};

		window.exportCurrentDebate = () => {
			if (!window.currentDebateData) return alert("No active debate to export.");
			
			const d = window.currentDebateData;
			let markdown = `# AI Council Debate Export\n\n`;
			markdown += `**Date:** ${new Date(d.timestamp).toLocaleString()}\n`;
			markdown += `**Provider/Model:** ${d.provider} (${d.model})\n\n`;
			markdown += `---\n\n## 📝 User Prompt\n\n${d.prompt}\n\n`;
			markdown += `---\n\n## 🎯 Phase 3: Executive Summary\n\n${d.executive}\n\n`;
			markdown += `---\n\n## ⚖️ Phase 2: Moderator Synthesis & Audit\n\n${d.synthesis}\n\n`;
			markdown += `---\n\n## 🗣️ Phase 1: Raw Council Transcripts\n\n`;
			
			d.council.forEach(member => {
				markdown += `### [ ${member.name} ]\n\n${member.raw}\n\n`;
			});

			const blob = new Blob([markdown], { type: 'text/markdown' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = `council_debate_${d.timestamp}.md`;
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(url);
		};

		function loadHistoryItem(item) {
			window.currentDebateData = item;
			els.userPrompt.value = item.prompt;
			els.debateGrid.innerHTML = '';
			
			item.council.forEach(memberResp => {
				window.rawOutputs[`member-${memberResp.id}`] = memberResp.raw;
				const box = createMemberBox(memberResp.id, memberResp.name);
				els.debateGrid.appendChild(box);
				
				const contentDiv = document.getElementById(`content-${memberResp.id}`);
				contentDiv.innerHTML = `<p>${formatMarkdown(memberResp.raw)}</p>`;
				contentDiv.classList.remove('italic', 'text-slate-500');
				contentDiv.classList.add('text-slate-300');
				
				document.getElementById(`indicator-${memberResp.id}`).classList.replace('bg-blue-500', 'bg-slate-600');
			});

			els.executiveContainer.classList.remove('hidden');
			window.rawOutputs['executiveRaw'] = item.executive;
			els.executiveOutput.innerHTML = `<p>${formatMarkdown(item.executive)}</p>`;

			els.auditLogContainer.classList.remove('hidden');
			els.auditLogContainer.removeAttribute('open'); // Start collapsed
			window.rawOutputs['synthesisRaw'] = item.synthesis;
			els.contentSynthesis.innerHTML = `<p>${formatMarkdown(item.synthesis)}</p>`;
			els.contentSynthesis.classList.remove('italic', 'text-slate-500');
			els.contentSynthesis.classList.add('text-slate-300');

			els.historyPanel.classList.add('hidden');
		}

		function createMemberBox(id, name) {
			const box = document.createElement('div');
			box.className = 'p-5 bg-slate-900 rounded-xl border border-slate-700 shadow-sm flex flex-col h-full transition-all';
			box.innerHTML = `
				<div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
					<h3 class="font-bold text-slate-100 flex items-center gap-3 cursor-pointer select-none" onclick="toggleCollapse('${id}')">
						<span class="text-xs text-slate-400 w-3 text-center" id="icon-${id}">▼</span>
						<span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse-fast inline-block" id="indicator-${id}"></span>
						<span class="tracking-wide">${name}</span>
					</h3>
					<button onclick="copyRawText('member-${id}')" class="text-slate-400 hover:text-white transition-colors" title="Copy Text">📋</button>
				</div>
				<div id="content-${id}" class="markdown-content text-sm text-slate-400 italic flex-1 overflow-hidden transition-all">Formulating argument...</div>
			`;
			return box;
		}

		function formatMarkdown(text) {
			return text
				.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
				.replace(/### (.*?)\n/g, '<h3 class="text-lg font-bold mt-4 mb-2">$1</h3>')
				.replace(/## (.*?)\n/g, '<h2 class="text-xl font-bold mt-5 mb-2 text-white">$1</h2>')
				.replace(/\n\n/g, '</p><p>')
				.replace(/\n- /g, '<br>• ')
				.replace(/\n\* /g, '<br>• ');
		}

		async function fetchLLM(systemPrompt, userPrompt) {
			const apiKey = state.apiKeys[state.provider];
			if (!apiKey) throw new Error(`API Key for ${state.provider} is missing. Please add it in settings.`);
			
			if (state.provider === 'openai' || state.provider === 'deepseek') {
				const endpoint = state.provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.deepseek.com/chat/completions';
				const res = await fetch(endpoint, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
					body: JSON.stringify({
						model: state.model,
						messages: [
							{ role: 'system', content: systemPrompt },
							{ role: 'user', content: userPrompt }
						]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.choices[0].message.content;
			}
			
			if (state.provider === 'anthropic') {
				const res = await fetch('https://api.anthropic.com/v1/messages', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'x-api-key': apiKey,
						'anthropic-version': '2023-06-01',
						'anthropic-dangerous-direct-browser-access': 'true'
					},
					body: JSON.stringify({
						model: state.model,
						max_tokens: 4096,
						system: systemPrompt,
						messages: [{ role: 'user', content: userPrompt }]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.content[0].text;
			}
			
			if (state.provider === 'gemini') {
				const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${apiKey}`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						systemInstruction: { parts: [{ text: systemPrompt }] },
						contents: [{ role: 'user', parts: [{ text: userPrompt }] }]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.candidates[0].content.parts[0].text;
			}
		}

		async function runCouncil() {
			const promptText = els.userPrompt.value.trim();
			if(!promptText) return alert('Please enter a premise for the council.');
			
			const apiKey = state.apiKeys[state.provider];
			if(!apiKey) {
				els.settingsPanel.classList.remove('hidden');
				els.historyPanel.classList.add('hidden');
				return alert(`Please enter your ${state.provider.toUpperCase()} API key in settings.`);
			}
			
			state.isRunning = true;
			els.submitBtn.disabled = true;
			els.submitBtn.innerText = 'Council is Deliberating...';
			els.settingsPanel.classList.add('hidden');
			els.historyPanel.classList.add('hidden');
			
			// Reset UI
			els.debateGrid.innerHTML = '';
			window.rawOutputs = {};
			els.executiveContainer.classList.remove('hidden');
			els.executiveIndicator.classList.remove('hidden');
			els.executiveIndicator.classList.add('animate-pulse-fast');
			els.executiveOutput.innerHTML = '<span class="italic text-emerald-300">Phase 1: Council is deliberating...</span>';
			
			els.auditLogContainer.classList.remove('hidden');
			els.auditLogContainer.removeAttribute('open');
			els.contentSynthesis.innerHTML = '<span class="italic text-slate-500">Awaiting council transcripts...</span>';
			
			const historyItem = { 
				timestamp: Date.now(), 
				prompt: promptText, 
				provider: state.provider,
				model: state.model,
				council: [], 
				synthesis: "", 
				executive: "" 
			};
			
			// Phase 1: Fan-out
			let transcriptBuilder = "";
			const tasks = state.members.map(async (member) => {
				const box = createMemberBox(member.id, member.name);
				els.debateGrid.appendChild(box);
				const contentDiv = document.getElementById(`content-${member.id}`);
				const indicatorDiv = document.getElementById(`indicator-${member.id}`);
				
				try {
					const response = await fetchLLM(member.prompt, promptText);
					window.rawOutputs[`member-${member.id}`] = response;
					historyItem.council.push({ id: member.id, name: member.name, raw: response });
					
					contentDiv.innerHTML = `<p>${formatMarkdown(response)}</p>`;
					contentDiv.classList.remove('italic', 'text-slate-500');
					contentDiv.classList.add('text-slate-400');
					indicatorDiv.classList.replace('bg-blue-500', 'bg-emerald-500');
					indicatorDiv.classList.remove('animate-pulse-fast');
					return `--- ${member.name.toUpperCase()} ---\n${response}\n\n`;
				} catch (err) {
					contentDiv.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
					indicatorDiv.classList.replace('bg-blue-500', 'bg-red-500');
					indicatorDiv.classList.remove('animate-pulse-fast');
					return `--- ${member.name.toUpperCase()} ---\nError: ${err.message}\n\n`;
				}
			});
			
			const results = await Promise.all(tasks);
			transcriptBuilder = results.join("");
			
			// Phase 2: Synthesis
			els.executiveOutput.innerHTML = '<span class="italic text-emerald-300">Phase 2: Moderator is compiling the audit and synthesis...</span>';
			els.contentSynthesis.innerHTML = '<span class="italic text-slate-400 animate-pulse">Synthesizing...</span>';
			
			let synthesisFinal = "";
			try {
				const synthPrompt = `User's Original Premise: ${promptText}\n\n--- COUNCIL DEBATE TRANSCRIPT ---\n\n${transcriptBuilder}`;
				synthesisFinal = await fetchLLM(state.overseerPrompt, synthPrompt);
				
				window.rawOutputs['synthesisRaw'] = synthesisFinal;
				historyItem.synthesis = synthesisFinal;
				els.contentSynthesis.innerHTML = `<p>${formatMarkdown(synthesisFinal)}</p>`;
				els.contentSynthesis.classList.remove('italic', 'text-slate-500');
				els.contentSynthesis.classList.add('text-slate-300');
			} catch (err) {
				els.contentSynthesis.innerHTML = `<span class="text-red-400">Synthesis Failed: ${err.message}</span>`;
				synthesisFinal = "Synthesis failed due to an error.";
			}

			// Phase 3: Executive Summary
			els.executiveOutput.innerHTML = '<span class="italic text-emerald-300">Phase 3: Translating synthesis into executive summary...</span>';
			
			try {
				const execPrompt = `Moderator Synthesis:\n\n${synthesisFinal}`;
				const executiveFinal = await fetchLLM(state.communicatorPrompt, execPrompt);
				
				window.rawOutputs['executiveRaw'] = executiveFinal;
				historyItem.executive = executiveFinal;
				window.currentDebateData = historyItem; // Set for export
				
				els.executiveOutput.innerHTML = `<p>${formatMarkdown(executiveFinal)}</p>`;
				
				state.history.push(historyItem);
				saveState();
				renderHistory();
			} catch (err) {
				els.executiveOutput.innerHTML = `<span class="text-red-400">Executive Summary Failed: ${err.message}</span>`;
			}
			
			els.executiveIndicator.classList.remove('animate-pulse-fast');
			
			state.isRunning = false;
			els.submitBtn.disabled = false;
			els.submitBtn.innerText = 'Convene Council';
		}

		init();
	</script>
</body>

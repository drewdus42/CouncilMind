<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Council Orchestrator</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@keyframes pulse-fast {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.3; }
		}
		.animate-pulse-fast {
			animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		.markdown-content p { margin-bottom: 0.75em; }
		.markdown-content ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
		.markdown-content h3 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
	</style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">
	
	<!-- App Wrapper -->
	<div class="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 space-y-6">
		
		<!-- Header & Settings Toggle -->
		<header class="flex justify-between items-center bg-white p-5 rounded-xl shadow-sm border border-slate-200">
			<div>
				<h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI Council Orchestrator</h1>
				<p class="text-sm text-slate-500">Multi-Agent Debate Framework</p>
			</div>
			<button id="toggleSettingsBtn" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-sm font-semibold transition-colors">
				⚙️ Settings
			</button>
		</header>

		<!-- Settings Panel -->
		<div id="settingsPanel" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6 transition-all">
			<h2 class="text-xl font-bold border-b border-slate-100 pb-2">Configuration</h2>
			
			<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
				<div class="lg:col-span-1">
					<label class="block text-sm font-semibold mb-1 text-slate-700">Provider</label>
					<select id="providerSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
						<option value="openai">OpenAI</option>
						<option value="anthropic">Anthropic</option>
						<option value="gemini">Google Gemini</option>
						<option value="deepseek">DeepSeek</option>
					</select>
				</div>
				<div class="lg:col-span-1">
					<label class="block text-sm font-semibold mb-1 text-slate-700">Model Name</label>
					<input type="text" id="modelInput" value="gpt-4o" class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div class="lg:col-span-2">
					<label class="block text-sm font-semibold mb-1 text-slate-700">API Key</label>
					<input type="password" id="apiKeyInput" placeholder="Enter your API Key (stored locally only)" class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
			</div>

			<div class="border-t border-slate-100 pt-5">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-lg font-bold text-slate-800">Council Members</h3>
					<button id="addMemberBtn" class="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 text-sm font-semibold transition-colors">
						+ Add Member
					</button>
				</div>
				<div id="councilList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<!-- Dynamically populated via JS -->
				</div>
			</div>

			<div class="border-t border-slate-100 pt-5">
				<label class="block text-lg font-bold mb-2 text-slate-800">Overseer Protocol (Final Synthesis)</label>
				<textarea id="overseerPrompt" rows="3" class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
			</div>
		</div>

		<!-- Main Input Area -->
		<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
			<label class="block text-lg font-bold mb-3 text-slate-900">Issue to the Council</label>
			<div class="flex flex-col md:flex-row gap-4">
				<textarea id="userPrompt" rows="2" placeholder="State your premise, dilemma, or question..." class="flex-1 p-4 border border-slate-300 rounded-lg bg-slate-50 resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"></textarea>
				<button id="submitBtn" class="px-8 py-4 bg-slate-800 text-white rounded-lg font-bold hover:bg-slate-700 transition-colors disabled:opacity-50 md:w-auto w-full flex-shrink-0">
					Convene Council
				</button>
			</div>
		</div>

		<!-- Active Debate Grid -->
		<div id="debateGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
			<!-- Populated by JS during runtime -->
		</div>

		<!-- Final Synthesis Container -->
		<div id="synthesisContainer" class="hidden bg-blue-50/50 p-6 md:p-8 rounded-xl shadow-sm border border-blue-200 mt-8">
			<div class="flex items-center gap-3 mb-6 border-b border-blue-200 pb-3">
				<h2 class="text-2xl font-bold text-blue-900 tracking-tight">Moderator Synthesis</h2>
				<span id="synthesisIndicator" class="w-3 h-3 rounded-full bg-blue-500 hidden"></span>
			</div>
			<div id="synthesisOutput" class="markdown-content text-blue-900 text-lg leading-relaxed"></div>
		</div>

	</div>

	<script>
		// --- Application State ---
		const state = {
			provider: 'openai',
			model: 'gpt-4o',
			apiKey: '',
			overseerPrompt: "You are the Moderator. Read the council debate. Map where they agree, highlight unresolvable disagreements, and provide a final executive summary. You must audit the provided logic. Do not generate original ideas, but point out if critical information is missing from the council's assessment.",
			members: [
				{ id: 1, name: 'Empiricist', prompt: 'You are the Empiricist. Provide only verified data, physics, and raw computational facts. Do not give opinions.' },
				{ id: 2, name: 'Forecaster', prompt: 'You are the Forecaster. Project the 10-, 50-, and 100-year second- and third-order consequences based strictly on the user premise.' },
				{ id: 3, name: 'Humanist', prompt: 'You are the Humanist. Evaluate the sociological and psychological impact on human populations.' },
				{ id: 4, name: 'Red Teamer', prompt: 'You are the Red Teamer. Sabotage and find the fatal flaws in the premise. Point out worst-case scenarios.' }
			],
			isRunning: false
		};

		// --- DOM Elements ---
		const els = {
			toggleSettingsBtn: document.getElementById('toggleSettingsBtn'),
			settingsPanel: document.getElementById('settingsPanel'),
			providerSelect: document.getElementById('providerSelect'),
			modelInput: document.getElementById('modelInput'),
			apiKeyInput: document.getElementById('apiKeyInput'),
			councilList: document.getElementById('councilList'),
			addMemberBtn: document.getElementById('addMemberBtn'),
			overseerPrompt: document.getElementById('overseerPrompt'),
			userPrompt: document.getElementById('userPrompt'),
			submitBtn: document.getElementById('submitBtn'),
			debateGrid: document.getElementById('debateGrid'),
			synthesisContainer: document.getElementById('synthesisContainer'),
			synthesisOutput: document.getElementById('synthesisOutput'),
			synthesisIndicator: document.getElementById('synthesisIndicator')
		};

		// --- Default Model Mapping ---
		const defaultModels = {
			'openai': 'gpt-4o',
			'anthropic': 'claude-3-5-sonnet-20240620',
			'gemini': 'gemini-1.5-pro',
			'deepseek': 'deepseek-chat'
		};

		// --- Initialization & Event Listeners ---
		function init() {
			els.toggleSettingsBtn.addEventListener('click', () => {
				els.settingsPanel.classList.toggle('hidden');
			});

			els.providerSelect.addEventListener('change', (e) => {
				state.provider = e.target.value;
				els.modelInput.value = defaultModels[state.provider];
				state.model = els.modelInput.value;
			});

			els.modelInput.addEventListener('input', (e) => state.model = e.target.value);
			els.apiKeyInput.addEventListener('input', (e) => state.apiKey = e.target.value);
			els.overseerPrompt.addEventListener('input', (e) => state.overseerPrompt = e.target.value);

			els.addMemberBtn.addEventListener('click', () => {
				state.members.push({ id: Date.now(), name: 'New Persona', prompt: 'Enter conditioning rules here...' });
				renderCouncilSettings();
			});

			els.submitBtn.addEventListener('click', runCouncil);
			els.userPrompt.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runCouncil();
			});

			els.overseerPrompt.value = state.overseerPrompt;
			renderCouncilSettings();
		}

		// --- Render Settings UI ---
		function renderCouncilSettings() {
			els.councilList.innerHTML = '';
			state.members.forEach((member, index) => {
				const card = document.createElement('div');
				card.className = 'p-4 bg-slate-50 border border-slate-200 rounded-lg flex flex-col gap-3 relative group transition-colors focus-within:border-blue-300';
				card.innerHTML = `
					<div class="flex justify-between items-center">
						<input type="text" class="font-bold text-slate-800 bg-transparent outline-none w-2/3 border-b border-transparent focus:border-blue-400 transition-colors" value="${member.name}" onchange="updateMemberName(${index}, this.value)">
						<button class="text-red-500 text-xs font-semibold px-2 py-1 rounded hover:bg-red-100 opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity" onclick="removeMember(${index})">Remove</button>
					</div>
					<textarea rows="3" class="w-full text-sm p-2 bg-white border border-slate-200 rounded outline-none focus:ring-2 focus:ring-blue-100 resize-y" onchange="updateMemberPrompt(${index}, this.value)">${member.prompt}</textarea>
				`;
				els.councilList.appendChild(card);
			});
		}

		window.updateMemberName = (index, val) => state.members[index].name = val;
		window.updateMemberPrompt = (index, val) => state.members[index].prompt = val;
		window.removeMember = (index) => { state.members.splice(index, 1); renderCouncilSettings(); };

		// --- Universal API Fetcher ---
		async function fetchLLM(systemPrompt, userPrompt) {
			if (!state.apiKey) throw new Error("API Key is missing.");
			
			// OpenAI & DeepSeek (OpenAI API Compatible)
			if (state.provider === 'openai' || state.provider === 'deepseek') {
				const endpoint = state.provider === 'openai' 
					? 'https://api.openai.com/v1/chat/completions' 
					: 'https://api.deepseek.com/chat/completions';
				
				const res = await fetch(endpoint, {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'Authorization': `Bearer ${state.apiKey}`
					},
					body: JSON.stringify({
						model: state.model,
						messages: [
							{ role: 'system', content: systemPrompt },
							{ role: 'user', content: userPrompt }
						]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.choices[0].message.content;
			}
			
			// Anthropic (Uses direct browser access header)
			if (state.provider === 'anthropic') {
				const res = await fetch('https://api.anthropic.com/v1/messages', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json',
						'x-api-key': state.apiKey,
						'anthropic-version': '2023-06-01',
						'anthropic-dangerous-direct-browser-access': 'true'
					},
					body: JSON.stringify({
						model: state.model,
						max_tokens: 4096,
						system: systemPrompt,
						messages: [
							{ role: 'user', content: userPrompt }
						]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.content[0].text;
			}
			
			// Google Gemini
			if (state.provider === 'gemini') {
				const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						systemInstruction: { parts: [{ text: systemPrompt }] },
						contents: [{ role: 'user', parts: [{ text: userPrompt }] }]
					})
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json();
				return data.candidates[0].content.parts[0].text;
			}
		}

		// --- Core Orchestration Logic ---
		async function runCouncil() {
			const promptText = els.userPrompt.value.trim();
			if(!promptText) return alert('Please enter a premise for the council.');
			if(!state.apiKey) {
				els.settingsPanel.classList.remove('hidden');
				els.apiKeyInput.focus();
				return alert('Please enter your API key in the settings panel.');
			}
			
			// Update UI State
			state.isRunning = true;
			els.submitBtn.disabled = true;
			els.submitBtn.innerText = 'Council is Deliberating...';
			
			els.debateGrid.innerHTML = '';
			els.debateGrid.classList.remove('hidden');
			els.synthesisContainer.classList.add('hidden');
			els.synthesisOutput.innerHTML = '';
			
			// Build Grid UI for each Council Member
			const memberBoxes = {};
			state.members.forEach(member => {
				const box = document.createElement('div');
				box.className = 'p-6 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col h-full';
				box.innerHTML = `
					<h3 class="font-bold text-slate-800 border-b border-slate-100 pb-3 mb-4 flex items-center gap-3">
						<span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse-fast inline-block" id="indicator-${member.id}"></span>
						<span class="tracking-wide">${member.name}</span>
					</h3>
					<div id="content-${member.id}" class="markdown-content text-sm text-slate-600 italic flex-1">Formulating argument...</div>
				`;
				els.debateGrid.appendChild(box);
				memberBoxes[member.id] = box;
			});
			
			// Phase 1: Fan-out execution (Run all members blindly and concurrently)
			let transcriptBuilder = "";
			const tasks = state.members.map(async (member) => {
				const contentDiv = document.getElementById(`content-${member.id}`);
				const indicatorDiv = document.getElementById(`indicator-${member.id}`);
				
				try {
					const response = await fetchLLM(member.prompt, promptText);
					
					// Basic Markdown to HTML formatting for display
					const formattedOutput = response
						.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
						.replace(/\n\n/g, '</p><p>')
						.replace(/\n- /g, '<br>• ');
						
					contentDiv.innerHTML = `<p>${formattedOutput}</p>`;
					contentDiv.classList.remove('italic', 'text-slate-600');
					contentDiv.classList.add('text-slate-800');
					
					indicatorDiv.classList.replace('bg-blue-500', 'bg-emerald-500');
					indicatorDiv.classList.remove('animate-pulse-fast');
					
					return `--- ${member.name.toUpperCase()} ---\n${response}\n\n`;
				} catch (err) {
					contentDiv.innerHTML = `<span class="text-red-600 font-semibold">Connection Error:</span> ${err.message}`;
					indicatorDiv.classList.replace('bg-blue-500', 'bg-red-500');
					indicatorDiv.classList.remove('animate-pulse-fast');
					return `--- ${member.name.toUpperCase()} ---\nError retrieving logic: ${err.message}\n\n`;
				}
			});
			
			// Wait for all members to finish compiling
			const results = await Promise.all(tasks);
			transcriptBuilder = results.join("");
			
			// Phase 2: The Overseer Synthesis
			els.synthesisContainer.classList.remove('hidden');
			els.synthesisIndicator.classList.remove('hidden');
			els.synthesisIndicator.classList.add('animate-pulse-fast');
			els.synthesisOutput.innerHTML = '<span class="italic text-blue-700">The Moderator is reviewing the council transcript and auditing logic gaps...</span>';
			
			try {
				const synthPrompt = `User's Original Premise: ${promptText}\n\n--- COUNCIL DEBATE TRANSCRIPT ---\n\n${transcriptBuilder}`;
				const synthesis = await fetchLLM(state.overseerPrompt, synthPrompt);
				
				// Format final output
				const formattedSynthesis = synthesis
					.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
					.replace(/### (.*?)\n/g, '<h3 class="text-xl font-bold mt-4 mb-2">$1</h3>')
					.replace(/\n\n/g, '</p><p>')
					.replace(/\n- /g, '<br>• ');
					
				els.synthesisOutput.innerHTML = `<p>${formattedSynthesis}</p>`;
			} catch (err) {
				els.synthesisOutput.innerHTML = `<span class="text-red-600 font-semibold">Moderator Synthesis Failed:</span> ${err.message}`;
			}
			
			// Cleanup UI State
			els.synthesisIndicator.classList.remove('animate-pulse-fast');
			els.synthesisIndicator.classList.replace('bg-blue-500', 'bg-emerald-500');
			
			state.isRunning = false;
			els.submitBtn.disabled = false;
			els.submitBtn.innerText = 'Convene Council';
		}

		// Boot app
		init();
	</script>
</body>
</html>

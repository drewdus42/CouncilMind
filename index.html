<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI Council Orchestrator</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@keyframes pulse-fast {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.3; }
		}
		.animate-pulse-fast {
			animation: pulse-fast 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
		.markdown-content p { margin-bottom: 0.75em; }
		.markdown-content ul { list-style-type: disc; margin-left: 1.5em; margin-bottom: 0.75em; }
		.markdown-content h3 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e2e8f0; }
		.markdown-content h2 { font-weight: bold; margin-top: 1.2em; margin-bottom: 0.5em; color: #f8fafc; }
		.markdown-content strong { color: #f8fafc; }
		
		/* Custom Scrollbar */
		::-webkit-scrollbar { width: 8px; }
		::-webkit-scrollbar-track { background: #0f172a; }
		::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
		::-webkit-scrollbar-thumb:hover { background: #475569; }

		details > summary { list-style: none; }
		details > summary::-webkit-details-marker { display: none; }
	</style>
</head>
<body class="bg-slate-900 text-slate-300 font-sans min-h-screen pb-6 transition-colors duration-200">
	
	<!-- App Wrapper -->
	<div class="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 flex flex-col min-h-screen">
		
		<!-- Header & Controls -->
		<header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700 mb-6 gap-4">
			<div>
				<h1 class="text-2xl font-bold text-slate-100 tracking-tight">AI Council Orchestrator</h1>
				<p class="text-sm text-slate-400">Dynamic Multi-Turn Agent Routing</p>
			</div>
			<div class="flex flex-wrap gap-2">
				<button onclick="startNewDebate()" class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-500 rounded-lg text-sm font-semibold transition-colors shadow-sm">
					➕ New Debate
				</button>
				<button onclick="exportCurrentDebate()" class="px-4 py-2 bg-slate-700 text-emerald-400 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shadow-sm" title="Export Full Session (.md)">
					💾 Export
				</button>
				<button id="toggleHistoryBtn" class="px-4 py-2 bg-slate-700 text-slate-200 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shadow-sm">
					📚 History
				</button>
				<button id="toggleSettingsBtn" class="px-4 py-2 bg-slate-700 text-slate-200 hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors shadow-sm">
					⚙️ Settings
				</button>
			</div>
		</header>

		<!-- History Panel -->
		<div id="historyPanel" class="hidden bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-6 space-y-4">
			<div class="flex justify-between items-center border-b border-slate-700 pb-2">
				<h2 class="text-xl font-bold text-slate-100">Debate History</h2>
				<button id="clearHistoryBtn" class="text-red-400 hover:text-red-300 text-sm font-semibold">Clear All</button>
			</div>
			<div id="historyList" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
		</div>

		<!-- Settings Panel -->
		<div id="settingsPanel" class="hidden bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 mb-6 space-y-6">
			<h2 class="text-xl font-bold text-slate-100 border-b border-slate-700 pb-2">Configuration & API Keys</h2>
			
			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">OpenAI API Key</label>
					<input type="password" id="keyOpenai" placeholder="sk-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">Anthropic API Key</label>
					<input type="password" id="keyAnthropic" placeholder="sk-ant-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">Google Gemini API Key</label>
					<input type="password" id="keyGemini" placeholder="AIza..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
				<div>
					<label class="block text-sm font-semibold mb-1 text-slate-400">DeepSeek API Key</label>
					<input type="password" id="keyDeepseek" placeholder="sk-..." class="w-full p-2.5 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
				</div>
			</div>

			<div class="border-t border-slate-700 pt-5 space-y-4">
				<div>
					<label class="block text-lg font-bold mb-2 text-slate-100 flex items-center gap-2">
						<span class="w-6 h-6 rounded bg-purple-900 text-purple-300 flex items-center justify-center text-sm">0</span>
						Casting Director Protocol (Phase 0)
					</label>
					<textarea id="directorPrompt" rows="4" class="w-full p-3 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
				</div>
				<div>
					<label class="block text-lg font-bold mb-2 text-slate-100 flex items-center gap-2">
						<span class="w-6 h-6 rounded bg-blue-900 text-blue-300 flex items-center justify-center text-sm">2</span>
						Moderator/Auditor (Phase 2)
					</label>
					<textarea id="overseerPrompt" rows="3" class="w-full p-3 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
				</div>
				<div>
					<label class="block text-lg font-bold mb-2 text-slate-100 flex items-center gap-2">
						<span class="w-6 h-6 rounded bg-emerald-900 text-emerald-300 flex items-center justify-center text-sm">3</span>
						Executive Communicator (Phase 3)
					</label>
					<textarea id="communicatorPrompt" rows="3" class="w-full p-3 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
				</div>
			</div>
		</div>

		<!-- Chat Log Area (Scrollable) -->
		<div id="chatLog" class="flex flex-col gap-6 mb-6 flex-1 hidden"></div>

		<!-- Main Input Area (Sticky Bottom) -->
		<div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 sticky bottom-4 z-10">
			<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
				<label class="text-lg font-bold text-slate-100">Speak to the Council</label>
				<div class="flex gap-2 w-full md:w-auto">
					<select id="activeProvider" class="p-2 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:flex-none">
						<option value="openai">OpenAI</option>
						<option value="anthropic">Anthropic</option>
						<option value="gemini">Google Gemini</option>
						<option value="deepseek">DeepSeek</option>
					</select>
					<select id="activeModelSelect" class="p-2 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:w-48"></select>
					<input type="text" id="activeModelInput" class="hidden p-2 border border-slate-600 rounded-lg bg-slate-900 text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 flex-1 md:w-48" placeholder="Type model ID...">
				</div>
			</div>

			<div class="flex flex-col gap-4">
				<textarea id="userPrompt" rows="3" placeholder="State your premise, dilemma, or follow-up argument..." class="w-full p-4 border border-slate-600 rounded-lg bg-slate-900 text-slate-100 resize-y focus:outline-none focus:ring-2 focus:ring-blue-500 text-base placeholder-slate-500"></textarea>
				<button id="submitBtn" class="w-full py-4 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-500 transition-colors disabled:opacity-50 shadow-lg text-lg">
					Convene Council
				</button>
			</div>
		</div>

	</div>

	<script>
		// --- Model Definitions (Updated for late 2026) ---
		const providerModels = {
			'openai': ['gpt-6-luna', 'gpt-6.1-sol', 'gpt-5.6-terra', 'gpt-4o', 'gpt-4o-mini'],
			'anthropic': ['claude-sonnet-5-5', 'claude-opus-5-5', 'claude-fable-5-1', 'claude-haiku-4-5-20251001'],
			'gemini': ['gemini-3.8-flash', 'gemini-3.8-flash-lite', 'gemini-3.8-live', 'gemini-3.1-pro'],
			'deepseek': ['deepseek-flash', 'deepseek-chat']
		};

		// --- State & Strict Brevity Prompts ---
		const defaultDirectorPrompt = `You are the Council Casting Director. Read the user's premise and the conversation history. Determine the 2 to 4 most critical, specialized expert personas needed to analyze it. One persona MUST ALWAYS be a ruthless 'Red Teamer'. 

CRITICAL INSTRUCTION: Enforce strict brevity. You must explicitly instruct every expert to limit their response to 1-2 short paragraphs maximum.

Output ONLY a JSON array of objects. Do not include markdown blocks, intro text, or conversational filler. The output must be perfectly parseable by JSON.parse().
Format:
[
  {
    "name": "Title of Expert",
    "prompt": "You are the [Title]... [Strict rules]. Limit your response to 1-2 paragraphs max."
  }
]`;

		const state = {
			provider: 'openai',
			model: 'gpt-6-luna',
			isCustomModel: false,
			apiKeys: { openai: '', anthropic: '', gemini: '', deepseek: '' },
			directorPrompt: defaultDirectorPrompt,
			overseerPrompt: "You are the Moderator. Read the council debate. Map where they agree and disagree. CRITICAL: Be extremely concise. Limit your audit to 2-3 short paragraphs total. Point out missing context quickly.",
			communicatorPrompt: "You are the Executive Communicator. Translate the Moderator's Synthesis into a highly succinct chatbot-style response. Just give the bottom-line answer and core risks. Use 2-3 short bullet points max. Be fast and brief.",
			history: [],
			currentSessionId: null,
			isRunning: false
		};

		// --- DOM Elements ---
		const els = {
			toggleSettingsBtn: document.getElementById('toggleSettingsBtn'),
			settingsPanel: document.getElementById('settingsPanel'),
			toggleHistoryBtn: document.getElementById('toggleHistoryBtn'),
			historyPanel: document.getElementById('historyPanel'),
			historyList: document.getElementById('historyList'),
			clearHistoryBtn: document.getElementById('clearHistoryBtn'),
			
			keyOpenai: document.getElementById('keyOpenai'),
			keyAnthropic: document.getElementById('keyAnthropic'),
			keyGemini: document.getElementById('keyGemini'),
			keyDeepseek: document.getElementById('keyDeepseek'),
			
			activeProvider: document.getElementById('activeProvider'),
			activeModelSelect: document.getElementById('activeModelSelect'),
			activeModelInput: document.getElementById('activeModelInput'),
			userPrompt: document.getElementById('userPrompt'),
			submitBtn: document.getElementById('submitBtn'),
			
			directorPrompt: document.getElementById('directorPrompt'),
			overseerPrompt: document.getElementById('overseerPrompt'),
			communicatorPrompt: document.getElementById('communicatorPrompt'),
			
			chatLog: document.getElementById('chatLog')
		};

		// --- LocalStorage Management ---
		function saveState() {
			const toSave = {
				provider: state.provider,
				model: state.model,
				isCustomModel: state.isCustomModel,
				apiKeys: state.apiKeys,
				directorPrompt: state.directorPrompt,
				overseerPrompt: state.overseerPrompt,
				communicatorPrompt: state.communicatorPrompt,
				history: state.history
			};
			localStorage.setItem('ai_council_data_v6', JSON.stringify(toSave));
		}

		function loadState() {
			const saved = localStorage.getItem('ai_council_data_v6') || localStorage.getItem('ai_council_data_v5');
			if (saved) {
				const parsed = JSON.parse(saved);
				state.provider = parsed.provider || state.provider;
				state.model = parsed.model || state.model;
				state.isCustomModel = parsed.isCustomModel || false;
				state.apiKeys = parsed.apiKeys || state.apiKeys;
				state.directorPrompt = parsed.directorPrompt || state.directorPrompt;
				state.overseerPrompt = parsed.overseerPrompt || state.overseerPrompt;
				state.communicatorPrompt = parsed.communicatorPrompt || state.communicatorPrompt;
				state.history = parsed.history || [];
			}
			
			els.keyOpenai.value = state.apiKeys.openai;
			els.keyAnthropic.value = state.apiKeys.anthropic;
			els.keyGemini.value = state.apiKeys.gemini;
			els.keyDeepseek.value = state.apiKeys.deepseek;
			
			els.activeProvider.value = state.provider;
			els.directorPrompt.value = state.directorPrompt;
			els.overseerPrompt.value = state.overseerPrompt;
			els.communicatorPrompt.value = state.communicatorPrompt;
			
			updateModelDropdownUI();
			renderHistory();
		}

		function updateModelDropdownUI() {
			els.activeModelSelect.innerHTML = '';
			const models = providerModels[state.provider] || [];
			
			models.forEach(modelStr => {
				const opt = document.createElement('option');
				opt.value = modelStr;
				opt.innerText = modelStr;
				els.activeModelSelect.appendChild(opt);
			});
			const customOpt = document.createElement('option');
			customOpt.value = 'custom';
			customOpt.innerText = 'Custom Model...';
			els.activeModelSelect.appendChild(customOpt);

			if (state.isCustomModel) {
				els.activeModelSelect.value = 'custom';
				els.activeModelInput.value = state.model;
				els.activeModelInput.classList.remove('hidden');
			} else {
				if (models.includes(state.model)) {
					els.activeModelSelect.value = state.model;
				} else {
					els.activeModelSelect.value = models[0] || 'custom';
					state.model = els.activeModelSelect.value;
				}
				els.activeModelInput.classList.add('hidden');
			}
		}

		function init() {
			loadState();

			els.toggleSettingsBtn.addEventListener('click', () => {
				els.settingsPanel.classList.toggle('hidden');
				els.historyPanel.classList.add('hidden');
			});
			els.toggleHistoryBtn.addEventListener('click', () => {
				els.historyPanel.classList.toggle('hidden');
				els.settingsPanel.classList.add('hidden');
			});
			els.clearHistoryBtn.addEventListener('click', () => {
				if(confirm("Clear all debate history?")) {
					state.history = []; state.currentSessionId = null; 
					els.chatLog.innerHTML = ''; els.chatLog.classList.add('hidden');
					saveState(); renderHistory();
				}
			});

			els.keyOpenai.addEventListener('input', (e) => { state.apiKeys.openai = e.target.value; saveState(); });
			els.keyAnthropic.addEventListener('input', (e) => { state.apiKeys.anthropic = e.target.value; saveState(); });
			els.keyGemini.addEventListener('input', (e) => { state.apiKeys.gemini = e.target.value; saveState(); });
			els.keyDeepseek.addEventListener('input', (e) => { state.apiKeys.deepseek = e.target.value; saveState(); });

			els.activeProvider.addEventListener('change', (e) => {
				state.provider = e.target.value;
				state.isCustomModel = false;
				state.model = providerModels[state.provider][0];
				updateModelDropdownUI(); saveState();
			});
			els.activeModelSelect.addEventListener('change', (e) => {
				if (e.target.value === 'custom') {
					state.isCustomModel = true;
					els.activeModelInput.classList.remove('hidden');
					els.activeModelInput.focus();
					state.model = els.activeModelInput.value;
				} else {
					state.isCustomModel = false;
					els.activeModelInput.classList.add('hidden');
					state.model = e.target.value;
				}
				saveState();
			});
			els.activeModelInput.addEventListener('input', (e) => { state.model = e.target.value; saveState(); });

			els.directorPrompt.addEventListener('input', (e) => { state.directorPrompt = e.target.value; saveState(); });
			els.overseerPrompt.addEventListener('input', (e) => { state.overseerPrompt = e.target.value; saveState(); });
			els.communicatorPrompt.addEventListener('input', (e) => { state.communicatorPrompt = e.target.value; saveState(); });

			els.submitBtn.addEventListener('click', runDynamicCouncil);
			els.userPrompt.addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runDynamicCouncil();
			});
		}

		window.startNewDebate = () => {
			state.currentSessionId = null;
			els.chatLog.innerHTML = '';
			els.chatLog.classList.add('hidden');
			els.userPrompt.value = '';
		};

		function renderHistory() {
			els.historyList.innerHTML = '';
			if(state.history.length === 0) {
				els.historyList.innerHTML = '<p class="text-slate-500 italic text-sm">No past debates found.</p>';
				return;
			}
			[...state.history].reverse().forEach((session) => {
				const date = new Date(session.id).toLocaleString();
				const row = document.createElement('div');
				row.className = 'p-3 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:border-blue-500 transition-colors';
				row.innerHTML = `<div class="text-xs text-slate-500 mb-1">${date}</div><div class="text-sm text-slate-200 font-semibold truncate">${session.title}</div>`;
				row.addEventListener('click', () => loadHistorySession(session));
				els.historyList.appendChild(row);
			});
		}

		window.exportCurrentDebate = () => {
			let session = state.history.find(s => s.id === state.currentSessionId);
			if (!session || session.turns.length === 0) return alert("No active debate to export.");
			
			let markdown = `# AI Council Debate Export\n\n**Date:** ${new Date(session.id).toLocaleString()}\n\n---\n\n`;
			
			session.turns.forEach((turn, idx) => {
				markdown += `## 💬 Turn ${idx + 1}: User Prompt\n\n${turn.userPrompt}\n\n`;
				markdown += `### 🎯 Executive Summary\n\n${turn.executive}\n\n`;
				markdown += `### ⚖️ Moderator Synthesis\n\n${turn.synthesis}\n\n`;
				markdown += `### 🗣️ Council Transcripts\n\n`;
				turn.council.forEach(c => {
					markdown += `#### [ ${c.name} ]\n\n${c.raw}\n\n`;
				});
				markdown += `---\n\n`;
			});

			const blob = new Blob([markdown], { type: 'text/markdown' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url; a.download = `council_session_${session.id}.md`;
			document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
		};

		function loadHistorySession(session) {
			state.currentSessionId = session.id;
			els.chatLog.innerHTML = '';
			els.chatLog.classList.remove('hidden');
			
			session.turns.forEach((turn) => {
				renderCompletedTurn(turn);
			});

			els.historyPanel.classList.add('hidden');
			window.scrollTo(0, document.body.scrollHeight);
		}

		function renderCompletedTurn(turn) {
			// User Bubble
			els.chatLog.insertAdjacentHTML('beforeend', `
				<div class="flex justify-end">
					<div class="bg-blue-600 text-white p-4 rounded-xl max-w-3xl shadow-sm text-sm">
						${formatMarkdown(turn.userPrompt)}
					</div>
				</div>
			`);

			// Council Response Block
			const turnHtml = `
				<div class="flex justify-start">
					<div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-emerald-900/50 w-full relative">
						<div class="flex justify-between items-start mb-4">
							<h2 class="text-xl font-bold text-emerald-400 tracking-tight">Council Verdict</h2>
						</div>
						<div class="markdown-content text-slate-200 text-base leading-relaxed">${formatMarkdown(turn.executive)}</div>
						
						<details class="mt-6 group border-t border-slate-700 pt-4">
							<summary class="text-sm font-bold text-slate-400 cursor-pointer flex items-center gap-2 hover:text-slate-200 transition-colors">
								<span class="group-open:rotate-90 transition-transform">▶</span> View Audit & Transcripts
							</summary>
							
							<div class="mt-6 space-y-6">
								<div class="bg-slate-900 p-5 rounded-xl border border-blue-900/30">
									<h3 class="font-bold text-blue-400 mb-3 text-sm">Moderator Synthesis (Phase 2)</h3>
									<div class="markdown-content text-sm text-slate-400 leading-relaxed">${formatMarkdown(turn.synthesis)}</div>
								</div>
				
								<div>
									<h3 class="font-bold text-slate-300 mb-3 text-sm">Dynamic Council (Phase 1)</h3>
									<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
										${turn.council.map(c => `
											<div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
												<h4 class="font-bold text-purple-400 text-sm mb-2">${c.name}</h4>
												<div class="markdown-content text-xs text-slate-400 leading-relaxed">${formatMarkdown(c.raw)}</div>
											</div>
										`).join('')}
									</div>
								</div>
							</div>
						</details>
					</div>
				</div>
			`;
			els.chatLog.insertAdjacentHTML('beforeend', turnHtml);
		}

		function formatMarkdown(text) {
			if (!text) return '';
			return text
				.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
				.replace(/### (.*?)\n/g, '<h3 class="text-lg font-bold mt-4 mb-2">$1</h3>')
				.replace(/## (.*?)\n/g, '<h2 class="text-xl font-bold mt-5 mb-2 text-white">$1</h2>')
				.replace(/\n\n/g, '</p><p class="mt-2">')
				.replace(/\n- /g, '<br>• ')
				.replace(/\n\* /g, '<br>• ');
		}

		async function fetchLLM(systemPrompt, userPrompt, contextHistory = "") {
			const apiKey = state.apiKeys[state.provider];
			if (!apiKey) throw new Error(`API Key for ${state.provider} is missing.`);
			
			let finalPrompt = userPrompt;
			if (contextHistory) {
				finalPrompt = `--- CONVERSATION HISTORY ---\n${contextHistory}\n\n--- CURRENT PROMPT ---\n${userPrompt}`;
			}
			
			if (state.provider === 'openai' || state.provider === 'deepseek') {
				const endpoint = state.provider === 'openai' ? 'https://api.openai.com/v1/chat/completions' : 'https://api.deepseek.com/chat/completions';
				const res = await fetch(endpoint, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
					body: JSON.stringify({ model: state.model, messages: [ { role: 'system', content: systemPrompt }, { role: 'user', content: finalPrompt } ] })
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json(); return data.choices[0].message.content;
			}
			
			if (state.provider === 'anthropic') {
				const res = await fetch('https://api.anthropic.com/v1/messages', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
					body: JSON.stringify({ model: state.model, max_tokens: 4096, system: systemPrompt, messages: [{ role: 'user', content: finalPrompt }] })
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json(); return data.content[0].text;
			}
			
			if (state.provider === 'gemini') {
				const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${apiKey}`, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ systemInstruction: { parts: [{ text: systemPrompt }] }, contents: [{ role: 'user', parts: [{ text: finalPrompt }] }] })
				});
				if(!res.ok) throw new Error(await res.text());
				const data = await res.json(); return data.candidates[0].content.parts[0].text;
			}
		}

		async function runDynamicCouncil() {
			const promptText = els.userPrompt.value.trim();
			if(!promptText) return alert('Please enter a premise for the council.');
			if(!state.apiKeys[state.provider]) return alert(`Please enter your ${state.provider.toUpperCase()} API key in settings.`);
			if (state.isCustomModel && !state.model) return alert('Please type a model ID.');
			
			state.isRunning = true;
			els.submitBtn.disabled = true;
			els.settingsPanel.classList.add('hidden');
			els.historyPanel.classList.add('hidden');
			
			// Handle Context & Session
			let contextHistory = "";
			let session = state.history.find(s => s.id === state.currentSessionId);
			if (session) {
				session.turns.forEach(t => {
					contextHistory += `User: ${t.userPrompt}\nCouncil Summary: ${t.executive}\n\n`;
				});
			} else {
				session = { id: Date.now(), title: promptText.substring(0, 40) + "...", turns: [] };
				state.history.push(session);
				state.currentSessionId = session.id;
			}
			
			const currentTurn = { userPrompt: promptText, provider: state.provider, model: state.model, council: [], synthesis: "", executive: "" };
			
			els.chatLog.classList.remove('hidden');
			els.userPrompt.value = '';

			// Render User Prompt
			els.chatLog.insertAdjacentHTML('beforeend', `
				<div class="flex justify-end">
					<div class="bg-blue-600 text-white p-4 rounded-xl max-w-3xl shadow-sm text-sm">
						${formatMarkdown(promptText)}
					</div>
				</div>
			`);

			// Render Loading Block
			const loadingId = 'loading-' + Date.now();
			els.chatLog.insertAdjacentHTML('beforeend', `
				<div id="${loadingId}" class="flex justify-start">
					<div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 w-full">
						<span class="italic text-slate-400 animate-pulse" id="status-${loadingId}">Phase 0: Director is casting experts...</span>
					</div>
				</div>
			`);
			
			window.scrollTo(0, document.body.scrollHeight);
			const statusEl = document.getElementById(`status-${loadingId}`);
			
			// Phase 0: Casting Director
			let dynamicMembers = [];
			try {
				const rawDirectorOutput = await fetchLLM(state.directorPrompt, promptText, contextHistory);
				const jsonMatch = rawDirectorOutput.match(/\[[\s\S]*\]/);
				if (!jsonMatch) throw new Error("Director did not return a valid JSON array.");
				dynamicMembers = JSON.parse(jsonMatch[0]);
			} catch (err) {
				statusEl.innerText = `Casting Failed: ${err.message}. Retrying...`;
				state.isRunning = false; els.submitBtn.disabled = false; return;
			}

			// Phase 1: Fan-out
			statusEl.innerText = 'Phase 1: Experts are deliberating...';
			
			let transcriptBuilder = "";
			const tasks = dynamicMembers.map(async (member, idx) => {
				try {
					const response = await fetchLLM(member.prompt, promptText, contextHistory);
					currentTurn.council.push({ id: idx, name: member.name, prompt: member.prompt, raw: response });
					return `--- ${member.name.toUpperCase()} ---\nSYSTEM INSTRUCTIONS: ${member.prompt}\n\n${response}\n\n`;
				} catch (err) {
					currentTurn.council.push({ id: idx, name: member.name, prompt: member.prompt, raw: `Error: ${err.message}` });
					return `--- ${member.name.toUpperCase()} ---\nError: ${err.message}\n\n`;
				}
			});
			
			const results = await Promise.all(tasks);
			transcriptBuilder = results.join("");
			
			// Phase 2: Synthesis
			statusEl.innerText = 'Phase 2: Moderator compiling audit...';
			try {
				const synthPrompt = `User's Latest Prompt: ${promptText}\n\n--- CURRENT COUNCIL DEBATE TRANSCRIPT ---\n\n${transcriptBuilder}`;
				currentTurn.synthesis = await fetchLLM(state.overseerPrompt, synthPrompt, contextHistory);
			} catch (err) {
				currentTurn.synthesis = "Synthesis failed due to an error: " + err.message;
			}

			// Phase 3: Executive Summary
			statusEl.innerText = 'Phase 3: Translating summary...';
			try {
				const execPrompt = `Moderator Synthesis:\n\n${currentTurn.synthesis}`;
				currentTurn.executive = await fetchLLM(state.communicatorPrompt, execPrompt, contextHistory);
			} catch (err) {
				currentTurn.executive = "Summary Failed: " + err.message;
			}
			
			// Save & Render Completion
			session.turns.push(currentTurn);
			saveState();
			renderHistory();
			
			// Replace loading block with actual turn UI
			document.getElementById(loadingId).outerHTML = `
				<div class="flex justify-start">
					<div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-emerald-900/50 w-full relative">
						<div class="flex justify-between items-start mb-4">
							<h2 class="text-xl font-bold text-emerald-400 tracking-tight">Council Verdict</h2>
						</div>
						<div class="markdown-content text-slate-200 text-base leading-relaxed">${formatMarkdown(currentTurn.executive)}</div>
						
						<details class="mt-6 group border-t border-slate-700 pt-4">
							<summary class="text-sm font-bold text-slate-400 cursor-pointer flex items-center gap-2 hover:text-slate-200 transition-colors">
								<span class="group-open:rotate-90 transition-transform">▶</span> View Audit & Transcripts
							</summary>
							
							<div class="mt-6 space-y-6">
								<div class="bg-slate-900 p-5 rounded-xl border border-blue-900/30">
									<h3 class="font-bold text-blue-400 mb-3 text-sm">Moderator Synthesis (Phase 2)</h3>
									<div class="markdown-content text-sm text-slate-400 leading-relaxed">${formatMarkdown(currentTurn.synthesis)}</div>
								</div>
				
								<div>
									<h3 class="font-bold text-slate-300 mb-3 text-sm">Dynamic Council (Phase 1)</h3>
									<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
										${currentTurn.council.map(c => `
											<div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
												<h4 class="font-bold text-purple-400 text-sm mb-2">${c.name}</h4>
												<div class="markdown-content text-xs text-slate-400 leading-relaxed">${formatMarkdown(c.raw)}</div>
											</div>
										`).join('')}
									</div>
								</div>
							</div>
						</details>
					</div>
				</div>
			`;
			
			window.scrollTo(0, document.body.scrollHeight);
			state.isRunning = false;
			els.submitBtn.disabled = false;
			els.submitBtn.innerText = 'Convene Council';
		}

		init();
	</script>
</body>
</html>
